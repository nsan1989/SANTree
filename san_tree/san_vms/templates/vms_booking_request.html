{% extends 'index.html' %}
{% load crispy_forms_tags %}

{% block title %}
Cab Request
{% endblock %}

{% block start %}

<div class="container-fluid">
  <div class="row d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-xs-12 col-sm-12 col-md-4 col-lg-4 col-xl-4">
      <form id="cabForm" class="cab_form bg-light p-4 rounded" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" id="submitBtn" class="btn btn-primary">Request</button>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("cabForm");
    const submitBtn = document.getElementById("submitBtn");
    form.addEventListener("submit", function (event) {
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
    });
  });
</script>
{% endblock %}
