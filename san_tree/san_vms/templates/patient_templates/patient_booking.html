{% load crispy_forms_tags %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cab Booking</title>

    <!--Bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />

    <style>
      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", sans-serif;
        padding: 20px;
      }
      .page-heading h1 {
        text-transform: uppercase;
        font-weight: bold;
        text-align: center;
        color: #631d20;
        font-size: 28px;
      }
      .form-wrapper {
        width: 100%;
        max-width: 500px;
        border: 1px solid #fff;
        background-color: #631d20;
        padding: 2rem;
        border-radius: 0.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .form-title h1 {
        text-align: center;
        font-weight: bold;
        color: #fff;
        font-size: 24px;
        margin-bottom: 20px;
      }
      .form-content {
        color: #fff;
      }
      .alert {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 90%;
        max-width: 400px;
        background-color: #6b1d20;
        color: #fff;
        z-index: 999;
        padding: 15px;
        border-radius: 4px;
      }
      .form-control {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        color: #333;
      }
      .form-control:focus {
        background-color: #fff;
        border-color: #631d20;
        box-shadow: 0 0 0 0.2rem rgba(99, 29, 32, 0.25);
      }
      .btn {
        margin-top: 15px;
        font-weight: 600;
        padding: 10px 20px;
      }
      .btn-warning {
        background-color: #ffc107;
        border-color: #ffc107;
        color: #000;
      }
      .btn-warning:hover {
        background-color: #e0a800;
        border-color: #d39e00;
        color: #000;
      }
      .location-info {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 15px;
        font-size: 13px;
      }
      .errorlist {
        list-style-type: none;
        padding: 0;
        margin: 0;
        color: #ff6b6b;
      }
      .errorlist li {
        padding: 5px 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; justify-content: center">
      {% if messages %} {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">
        <span class="mb-2">{{ message }}</span>
        <button
          class="close-btn"
          onclick="this.parentElement.style.display = 'none'"
          style="width: 2rem; height: 2rem; border: none; border-radius: 0.2rem; background: #fff; cursor: pointer;"
        >
          OK
        </button>
      </div>
      {% endfor %} {% endif %}
    </div>
    
    <div class="container">
      <div class="row mb-4 w-100">
        <div class="col-12">
          <div class="page-heading">
            <h1>SHIJA Patient Cab Rental Portal</h1>
          </div>
        </div>
      </div>
      
      <div class="row w-100">
        <div class="col-12">
          <div class="form-wrapper">
            <div class="form-title">
              <h1>📍 Cab Booking</h1>
            </div>
            
            <div class="location-info">
              <strong>📌 Hospital Location:</strong>
              <div id="location-status">Loading location...</div>
            </div>
            
            <div class="form-content">
              <form
                id="bookingForm"
                action="{% url 'vms:patient_booking' %}"
                method="POST"
                enctype="multipart/form-data"
              >
                {% csrf_token %}
                
                {{ form|crispy }}
                
                <button type="submit" class="btn btn-warning w-100">
                  ✓ Submit Booking
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Set default hospital location
        const hospitalLocationField = document.getElementById('hospital_location');
        if (hospitalLocationField) {
          hospitalLocationField.value = 'SHIJA Hospital - Main Campus';
        }

        // Try to get user's current location for drop coordinates
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(position) {
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              
              document.getElementById('drop_latitude').value = lat;
              document.getElementById('drop_longitude').value = lng;
              
              document.getElementById('location-status').innerHTML = 
                `✓ Location detected<br><small>Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}</small>`;
            },
            function(error) {
              console.log('Geolocation error:', error);
              document.getElementById('location-status').innerHTML = 
                '⚠ Allow location access for better accuracy';
            },
            { timeout: 5000 }
          );
        } else {
          document.getElementById('location-status').innerHTML = 
            'ℹ Location services not available';
        }

        // Form validation before submit
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
          const hospitalLocation = document.getElementById('hospital_location').value;
          const dropLocation = document.getElementById('drop_location_text').value;
          const patientPhone = document.getElementById('patient_phone').value || 
                               document.querySelector('input[name="patient_phone"]').value;
          
          if (!hospitalLocation) {
            e.preventDefault();
            alert('Hospital location not set. Please refresh the page.');
            return false;
          }
          
          if (!dropLocation || dropLocation.trim() === '') {
            e.preventDefault();
            alert('Please enter a drop-off location');
            return false;
          }

          if (patientPhone && patientPhone.length !== 10) {
            e.preventDefault();
            alert('Please enter a valid 10-digit phone number');
            return false;
          }
        });
      });
    </script>
  </body>
</html>
        </div>
      </div>
    </div>
  </body>
</html>
