{% load static %}
{% block start %}
<!--style-->
<style>
  ul {
    list-style-type: none;
    padding-left: 0;
    margin: 0;
  }

  li {
    height: 3rem;
    overflow: hidden;
    width: 100%;
  }
  
  .sidebar_menu li {
    display: flex;
    align-items: center;
    padding: 10px;
  }

  .sidebar_menu li a {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }

  .sidebar .menu-label {
    opacity: 0;
    visibility: hidden;
    width: 0;
    overflow: hidden;
    transition: opacity 0.2s ease, width 0.2s ease;
  }

  .sidebar.expanded .menu-label {
    opacity: 1;
    visibility: visible;
    width: auto;
    font-family: 'Poppins', sans-serif;
  }

</style>
<!--------->
<!-- sidebar.html -->
<div id="sidebar-content" class="sidebar-content h-100">
  <ul class="sidebar_menu">
    <li class="demo-item">
      <a href="#" style="width: 100%;color: #990000;">
        <img class="img-flui" src="{% static 'images/logo.png' %}" style="height: 2rem;width: 2rem;">
        <p class="menu-label fw-bold m-0">SSMS</p>
      </a>
    </li>

    {% for item in sidebar_menu %}
    <li id="menu-list" class="{% if request.resolver_match.url_name == item.view_name %}active{% endif %}">
      <a href="{% url item.url_name %}" style="width: 100%;">
        <i style="display: flex;justify-content: center;color: #990000;height: 2rem;width: 2rem;" class="{{ item.icon }}"></i>
        <p style="color: #990000;" class="menu-label">{{ item.name }}</p>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
