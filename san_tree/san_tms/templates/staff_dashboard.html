{% extends 'index.html' %} {% load static %}
{% block title %} Dashboard {% endblock %} {% block start %}
  <style>
    .dashboard-title h1,
    .upcoming-title h3 {
      font-family: 'Poppins', sans-serif;
      color: wheat;
    }

    #calendar {
      width: 100%;
      font-size: 12px;
      background: #f3f3f3;
      margin: 0 auto;
    }
    .fc .fc-view-harness,
    .fc .fc-scroller {
      height: auto !important;
      overflow: visible !important;
    }
    .fc .fc-toolbar {
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .fc .fc-toolbar-title {
      font-size: 1rem;
    }

    .fc-scrollgrid-sync-inner a {
      text-decoration: none;
    }

    .btn {
      width: 8rem;
    }
    th, td {
      font-family: 'Poppins', sans-serif;
    }

    @media screen and (max-width: 767.98px) {
      .fc-button-group {
        margin-bottom: 0.5rem;
      }
    }
  </style>

  <div class="container-fluid">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-8 col-lg-8 col-xl-8">
        <div class="top-content">
          <div class="dashboard-title">
            <h1 class="fw-bold mb-0">Welcome</h1>
          </div>
          <div class="user-details d-flex flex-column mb-3" style="font-family: 'Poppins, sans-serif'">
            <h5 class="user-name m-0 fw-light text-light">
              {{current_user.username}}
            </h5>
          </div>
        </div>
        <div class="calendar-filters d-md-none d-flex flex-column gap-2 mb-3">
          <div class="dropdown">
            <button class="btn btn-warning dropdown-toggle calendarFilterBtn" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
              select
            </button>
            <ul class="dropdown-menu calendarFilterOptions">
              <li><a class="dropdown-item" data-view="dayGridMonth" href="#">Month</a></li>
              <li><a class="dropdown-item" data-view="timeGridWeek" href="#">Week</a></li>
              <li><a class="dropdown-item" data-view="timeGridDay" href="#">Day</a></li>
            </ul>
          </div>
          <p class="mb-0 text-warning">change calendar view.</p>
        </div>
        <div class="bottom-content mb-3">
          <div class="calender-wrapper">
            <div class="p-2 rounded" id="calendar"></div>
          </div>
        </div>
      </div>
      <div class="col-xs-12 col-sm-12 col-md-4 col-lg-4 col-xl-4">
        <div class="calendar-filters d-none d-md-flex flex-column gap-2 mb-3">
          <div class="dropdown">
            <button class="btn btn-warning dropdown-toggle calendarFilterBtn" type="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
              select
            </button>
            <ul class="dropdown-menu calendarFilterOptions">
              <li><a class="dropdown-item" data-view="dayGridMonth" href="#">Month</a></li>
              <li><a class="dropdown-item" data-view="timeGridWeek" href="#">Week</a></li>
              <li><a class="dropdown-item" data-view="timeGridDay" href="#">Day</a></li>
            </ul>
          </div>
          <p class="mb-0 text-warning">change calendar view.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        contentHeight: 'auto',
        expandRows: true,
        handleWindowResize: true,
        dayMaxEventRows: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },
        events: JSON.parse(`{{ calendar_events|escapejs }}`),
        eventClick: function (info) {
          window.location.href = info.event.url;
        }
      });

      calendar.render();

    // Filtering dropdown logic
      const filterMenus = document.querySelectorAll(".calendarFilterOptions");
      const filterButtons = document.querySelectorAll(".calendarFilterBtn");

      filterMenus.forEach((menu, index) => {
        menu.addEventListener("click", function (e) {
          if (e.target.matches(".dropdown-item")) {
            const view = e.target.getAttribute("data-view");
            calendar.changeView(view);

            if (filterButtons[index]) {
              filterButtons[index].innerText = e.target.innerText;
            }
          }
        });
      });
    });
  </script>

{% endblock %}
