{% load crispy_forms_tags %}
{% block start %}
<!--styles-->
  <style>
    .card-title,
    #handlerForm {
      font-family: 'Poppins', sans-serif;
    }
  </style>
<!---------->

  <div class="container">
    <div class="row d-flex justify-content-center py-3">
      <div class="col-md-6 col-lg-4 w-100">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-2">
            <h4 class="card-title text-center mb-4">Reassigned To</h4>
            <form id="handlerForm" method="post" action="{% url 'ams:admin_update_handler' request_obj.id %}">
              {% csrf_token %} {{ form|crispy }}

              <div class="d-grid mt-4">
                <button
                  id="submitBtn"
                  type="submit"
                  class="btn btn-lg"
                  style="border: 1px solid #800000; color: #800000"
                >
                  Submit
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  //submit button script
    document.addEventListener("DOMContentLoaded", function() {
      const form = document.getElementById("handlerForm");
      const submitBtn = document.getElementById("submitBtn");
      form.addEventListener("submit", function(event) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";
      });
    });
  </script>

{% endblock %}
